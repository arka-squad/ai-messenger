[package]
name = "messenger-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.8.9"
chrono = "=0.4.45"
notify = "=8.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["full"] }
uuid = { version = "=1.26.1", features = ["v4"] }
